<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nevtan Starter</title>
<style>
:root{--bg:#0f1117;--card:#181b25;--fg:#f2f4f8;--muted:#9aa3b2;--accent:#5b8cff;--line:#272b37}
@media (prefers-color-scheme: light){
  :root{--bg:#f5f6fa;--card:#ffffff;--fg:#14171f;--muted:#5d6675;--accent:#2f5fe0;--line:#e3e6ee}
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);
font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
.card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);
border-radius:16px;padding:32px 28px;box-shadow:0 10px 40px rgba(0,0,0,.18)}
h1{margin:0 0 6px;font-size:1.5rem;letter-spacing:-.01em}
p.sub{margin:0 0 24px;color:var(--muted);font-size:.925rem;line-height:1.5}
.clock{font-variant-numeric:tabular-nums;font-size:2.25rem;font-weight:600;margin:0 0 4px}
.date{color:var(--muted);font-size:.85rem;margin:0 0 24px}
button{width:100%;border:0;border-radius:10px;background:var(--accent);color:#fff;
font-size:.95rem;font-weight:600;padding:12px 16px;cursor:pointer}
button:hover{filter:brightness(1.08)}
.count{margin:16px 0 0;color:var(--muted);font-size:.85rem;text-align:center}
footer{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);
color:var(--muted);font-size:.78rem;text-align:center}
</style>
</head>
<body>
<main class="card">
  <h1>Nevtan Starter</h1>
  <p class="sub">A minimal static frontend, built on GitHub and deployed on Render.</p>
  <p class="clock" id="clock">--:--:--</p>
  <p class="date" id="date"></p>
  <button id="btn">Say hello</button>
  <p class="count" id="count">No clicks yet</p>
  <footer>Deployed from GitHub &middot; Served by Render</footer>
</main>
<script>
var greetings=["Hello there!","It works.","Deployed and live.","Hi from Render.","Shipping is fun."];
var n=0;
var btn=document.getElementById("btn");
var count=document.getElementById("count");
btn.addEventListener("click",function(){
  n++;
  btn.textContent=greetings[(n-1)%greetings.length];
  count.textContent=n===1?"1 click":n+" clicks";
});
function tick(){
  var d=new Date();
  document.getElementById("clock").textContent=d.toLocaleTimeString();
  document.getElementById("date").textContent=d.toDateString();
}
tick();setInterval(tick,1000);
</script>
</body>
</html>
